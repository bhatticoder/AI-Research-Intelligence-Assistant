services:
  # PostgreSQL - Primary database for users, documents, metadata
  postgres:
    image: postgres:16-alpine
    container_name: aria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aria
      POSTGRES_USER: aria_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aria_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria_user -d aria"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching, job queues, WebSocket pub/sub
  redis:
    image: redis:7-alpine
    container_name: aria-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB - Vector database for embeddings & RAG
  chromadb:
    image: chromadb/chroma:latest
    container_name: aria-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
      - IS_PERSISTENT=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3-compatible object storage for files
  minio:
    image: minio/minio:latest
    container_name: aria-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aria_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aria_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  minio_data:
